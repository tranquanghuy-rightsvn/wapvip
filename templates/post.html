<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="../../images/favicon.ico">
{{SEO_META}}
<link rel="stylesheet" href="../../css/style.css">
{{JSONLD}}
</head>
<body>
<div class="wrap">

  <!-- Logo banner -->
  <div class="banner">
    <div class="logo">
      <a href="../../index.html" style="color:inherit">{{LOGO_HTML}}</a>
    </div>
  </div>

  <!-- Nav row (dong bo voi index.html) -->
  <div class="nav-row">
{{NAV_ROW_LINKS}}
  </div>

  <!-- O tim kiem: khong co danh sach de loc tai day, submit se chuyen ve trang chu kem tu khoa (?q=) -->
  <div class="group-bar">
    <div class="links"><span class="arrow">»</span> <a href="#" class="a3">GROUP</a> <span class="sep">-</span> <a href="#" class="a2">YouTube</a> <span class="sep">-</span> <a href="#" class="a1">FANPAGE</a> <span class="arrow">«</span></div>
    <form class="search-form" method="get" action="../../index.html">
      <input type="text" name="q" placeholder="Bạn Cần Tìm Gì?">
      <button type="submit">Tìm</button>
    </form>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb">🏠 <a href="../../index.html">Trang Chủ</a> › {{BREADCRUMB_CATEGORY}}</div>

  <!-- Post title (icon dau tieu de, chon trong CMS - vd HOT/NEW/tay cam game/ten lua/phao no) -->
  <div class="hdr blue post-title">⬇ {{POST_ICON}}{{POST_TITLE}}</div>

  <!-- Post meta: ngay cap nhat + game (neu co) -->
  <div class="byline">{{POST_META}}</div>

  <!-- Article body (content tu CMS); nut tai game nam trong content, cuoi cung, to ro rang -->
  <div class="article-body">
{{CONTENT}}

{{DOWNLOAD_BUTTON}}
  </div>

  <!-- Home / Mini bottom nav -->
  <div class="bottom-nav">
    <a href="../../index.html">🏠 HOME</a>
    <a href="../../index.html">📁 MINI</a>
  </div>

  <div class="footer">{{FOOTER_TEXT}}</div>

</div>
</body>
</html>
