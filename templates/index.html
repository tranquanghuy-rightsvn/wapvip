<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
{{SEO_META}}
<link rel="stylesheet" href="css/style.css">
{{JSONLD}}
</head>
<body>
<div class="wrap">

  <!-- Logo banner -->
  <div class="banner">
    <div class="logo">
      {{LOGO_HTML}}
    </div>
  </div>

  <!-- Loi ngo -->
  <div class="intro">
    <h2>{{INTRO_TITLE}}</h2>
{{INTRO_PARAGRAPHS}}
  </div>

  <!-- Nav row (tu dong theo category, CMS quan ly) -->
  <div class="nav-row">
{{NAV_ROW_LINKS}}
  </div>

  <!-- O tim kiem: loc ngay tren trang (JS ben duoi), submit GET van hoat dong khong can JS -->
  <div class="group-bar">
    <div class="links"><span class="arrow">»</span> <a href="#" class="a3">GROUP</a> <span class="sep">-</span> <a href="#" class="a2">YouTube</a> <span class="sep">-</span> <a href="#" class="a1">FANPAGE</a> <span class="arrow">«</span></div>
    <form class="search-form" method="get" action="">
      <input type="text" id="search-input" name="q" placeholder="Bạn Cần Tìm Gì?">
      <button type="submit">Tìm</button>
    </form>
  </div>

  <!-- Banner ngang quang ba giai dau (ti le 21:9), CMS quan ly -->
  <div class="wide-banner">
{{BANNER_MEDIA}}
    <div class="cap">{{BANNER_TEXT}}</div>
  </div>

{{CATEGORY_SECTIONS}}
  <div class="search-empty hidden" id="search-empty">Không tìm thấy bài viết nào khớp từ khoá.</div>

  <div class="footer">{{FOOTER_TEXT}}</div>

</div>
<script>
(function () {
  function normalize(s) {
    return (s || '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  }
  var input = document.getElementById('search-input');
  var emptyMsg = document.getElementById('search-empty');
  if (!input) return;

  function applyFilter(rawQuery) {
    var q = normalize(rawQuery);
    var anyVisible = false;
    Array.prototype.slice.call(document.querySelectorAll('.list')).forEach(function (list) {
      var rows = Array.prototype.slice.call(list.querySelectorAll('.row[data-search]'));
      if (!rows.length) return; // list khong phai danh sach bai viet (vd khong co bai nao trong category)
      var visibleCount = 0;
      rows.forEach(function (row) {
        var match = !q || row.getAttribute('data-search').indexOf(q) !== -1;
        row.classList.toggle('hidden', !match);
        if (match) { visibleCount++; anyVisible = true; }
      });
      var showSection = !q || visibleCount > 0;
      list.classList.toggle('hidden', !showSection);
      var hdr = list.previousElementSibling;
      if (hdr && hdr.classList.contains('hdr')) hdr.classList.toggle('hidden', !showSection);
    });
    if (emptyMsg) emptyMsg.classList.toggle('hidden', !q || anyVisible);
  }

  input.addEventListener('input', function () { applyFilter(input.value); });
  var q = new URLSearchParams(location.search).get('q');
  if (q) { input.value = q; applyFilter(q); }
})();
</script>
</body>
</html>
